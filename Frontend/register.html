<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <h1>Hybrid Intelligent Hospital System</h1>

        <h2>Patient Registration</h2>

        <form id="registerForm">

            <input
                type="text"
                id="full_name"
                placeholder="Full Name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <input
                type="text"
                id="phone"
                placeholder="Phone Number"
                required
            >

            <button type="submit">
                Register
            </button>

        </form>

        <p id="message"></p>

        <a href="index.html">
            Already have an account? Login
        </a>

    </div>

    <script src="js/register.js"></script>

</body>

</html>
