<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Patient Dashboard</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="container">

        <h1>Hybrid Intelligent Hospital System</h1>

        <h2>Patient Dashboard</h2>

        <div class="info-box">

            <h3 id="welcome"></h3>

            <p id="email"></p>

            <p id="role"></p>

        </div>

        <button id="appointmentBtn">
            Book Appointment
        </button>

        <button id="queryBtn">
            Submit Patient Query
        </button>

        <button id="historyBtn">
            My Appointments
        </button>

        <button id="queryHistoryBtn">
            Query History
        </button>

        <button id="logoutBtn">
            Logout
        </button>

        <div class="footer">
            © 2026 Hybrid Intelligent Hospital System
        </div>

    </div>

    <script src="js/dashboard.js"></script>

</body>

</html>
